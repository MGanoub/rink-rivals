<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rink Rivals</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="leave" class="hidden" aria-label="Leave game">✕</button>

  <div id="menu" class="overlay">
    <div class="card">
      <h1><span class="r">Rink</span> <span class="b">Rivals</span></h1>
      <p class="sub">Arcade ice hockey for two.</p>
      <div class="pair">
        <button class="primary" id="btnCreate">Create room</button>
        <button class="primary blue" id="btnJoin">Join room</button>
      </div>
      <button class="secondary" id="btn2p">2 players, one phone</button>
      <button class="secondary" id="btnCpu">Practice vs computer</button>
      <div class="row">First to
        <span class="seg" id="seg">
          <button data-n="3">3</button><button data-n="5" class="on">5</button><button data-n="7">7</button>
        </span>
      </div>
      <p class="tally">Record: <b class="rd" id="recR">0</b> Red · Blue <b class="bl" id="recB">0</b>
        <br><button class="link" id="resetRec">Reset record</button></p>
    </div>
  </div>

  <div id="create" class="overlay hidden">
    <div class="card">
      <h2>Create a room</h2>
      <p class="sub">You'll get a 4-letter code to send your opponent.</p>
      <p class="err" id="createErr"></p>
      <button class="primary" id="btnCreateGo">Create room</button>
      <button class="secondary" data-back>Back</button>
    </div>
  </div>

  <div id="join" class="overlay hidden">
    <div class="card">
      <h2>Join a room</h2>
      <label for="joinCode">Room code</label>
      <input id="joinCode" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <p class="err" id="joinErr"></p>
      <button class="primary blue" id="btnJoinGo">Join room</button>
      <button class="secondary" data-back>Back</button>
    </div>
  </div>

  <div id="wait" class="overlay hidden">
    <div class="card">
      <p class="sub">Room code</p>
      <div class="code" id="codeText">----</div>
      <p class="sub" id="waitHint">Send your opponent this code.</p>
      <p class="sub"><b id="waitStatus">Waiting for your opponent…</b></p>
      <button class="primary blue" id="btnShare">Share invite</button>
      <button class="secondary" data-back>Cancel</button>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="card">
      <div class="big" id="winText">Red wins</div>
      <p class="sub" id="finalScore">5–3</p>
      <button class="primary" id="btnRematch">Rematch</button>
      <button class="secondary" data-back>Back to menu</button>
    </div>
  </div>

  <div id="notice" class="overlay hidden">
    <div class="card">
      <p class="sub" id="noticeText"></p>
      <button class="primary" data-back>Back to menu</button>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
